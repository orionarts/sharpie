[package]
name = "sharpie"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
description = "A SpringSharp 3 remake"
license = "GPL-3.0-only"
repository = "https://github.com/orionarts/sharpie"

[dependencies]
bitflags = { version = "2.8", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
format_num = "0.1"
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.17"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.17"
